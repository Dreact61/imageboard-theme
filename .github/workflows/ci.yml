name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature-*'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Setup pnpm
       uses: pnpm/action-setup@v4
       with: 
        version: 11
    
     - name: Setup Node.js
       uses: actions/setup-node@v4
       with:
        node-version: '22'

     - name: Check For Framework's Vulnerabilities
       run: pnpm audit --audit-level=high || true
    
     - name: Install Dependencies
       run: pnpm install

     - name: Build Frontend
       run: pnpm run build